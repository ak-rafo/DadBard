<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dad Bard">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Dad Bard 🪕</title>
<style>
:root{
  --bg:#17110d; --bg2:#1d1610; --card:#231a13; --card2:#2d2219; --line:#3d2f22; --text:#f3e7cf; --muted:#b19f85;
  --accent:#d6a24a; --accent2:#ecc06d; --ink:#1a1206; --good:#7cbf8a; --bad:#e07a62;
  --modern:#d6a24a; --classic:#9bb7cf; --tiki:#74bfa1; --andrew:#e88a5a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3e9d4; --bg2:#ede0c4; --card:#fbf5e7; --card2:#f1e5cb; --line:#dccaa5; --text:#2b1d10; --muted:#7a6650;
         --accent:#9a6b1c; --accent2:#7f5612; --ink:#fff8e8; --modern:#9a6b1c; --classic:#3e6a91; --tiki:#2c7f66; --andrew:#b4502a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg))}
a{color:var(--accent2);text-decoration:none}
#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px)}
h1{font:600 30px/1.1 var(--serif);margin:6px 0 8px;letter-spacing:.2px}
h2{font:600 13px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
h3{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
p{margin:6px 0}
.small{font-size:13px}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}
.top{padding:6px 2px 4px}
.hero .brand{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.logo{width:56px;height:56px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.hero h1{font-size:34px;margin:0}
.tagline{margin:0;font:italic 14px/1.3 var(--serif);color:var(--muted)}
.back{display:inline-block;margin:4px 0 2px;font-size:15px}
.searchrow{display:flex;gap:8px}
input[type=search],input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=search]{flex:1;min-width:0}
textarea{width:100%;resize:vertical}
.btn{font:inherit;font-size:14px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.btn.on{border-color:var(--accent);color:var(--accent2)}
.btn.ghost{background:transparent}
.catbar{display:flex;gap:6px;overflow-x:auto;margin:10px -2px 0;padding:0 2px 2px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar button{font:inherit;font-size:14px;flex:0 0 auto;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.catbar button span{font-size:11px;opacity:.75}
.catbar button.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.sortrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-size:14px}
.sortrow select{padding:6px 10px;font-size:14px}
.filters{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0}
.fgroup{margin-bottom:10px}.flabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;display:inline-block}
.chip span{color:var(--muted);font-size:11px;margin-left:2px}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent)}.chip.on span{color:var(--ink);opacity:.7}
.chips.static .chip{color:var(--accent2)}
.cards{list-style:none;margin:6px 0 0;padding:0}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0;color:var(--text)}
.card:active{background:var(--card2)}
.cname{font:600 18px/1.25 var(--serif)}.csub{font-size:13px;color:var(--muted)}
.marks{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.mk{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);vertical-align:middle}
.mk.av{color:var(--andrew);border-color:var(--andrew)}.mk.exp{font-style:italic}.mk.flag{color:var(--bad);border-color:var(--bad)}
.cside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.abv{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);vertical-align:middle}
.tick{color:var(--good);font-size:13px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);background:var(--card2);white-space:nowrap}
.pill.tiny{font-size:10px;padding:0 6px}
.cat-modern{color:var(--modern);border-color:var(--modern)}.cat-classic{color:var(--classic);border-color:var(--classic)}.cat-tiki{color:var(--tiki);border-color:var(--tiki)}.cat-andrew{color:var(--andrew);border-color:var(--andrew)}
.pill.exp{font-style:italic}
.pill.root{color:var(--accent2);border-color:var(--accent)}.pill.home{color:var(--good);border-color:var(--good)}.pill.equip{color:var(--bad);border-color:var(--bad)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.panel.mine{border-color:color-mix(in srgb,var(--andrew) 55%,var(--line));box-shadow:inset 3px 0 0 var(--andrew)}
.flagbox{border:1px dashed var(--bad);border-radius:var(--r);padding:10px 14px;margin:12px 0;font-size:14px;background:color-mix(in srgb,var(--bad) 7%,transparent)}
.flagbox b{color:var(--bad);font-size:13px;letter-spacing:.04em}.flagbox ul{margin:4px 0 0;padding-left:18px}
.controls{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:14px;background:transparent;color:var(--muted);border:0;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--ink);font-weight:600}
.scaler{display:flex;align-items:center;gap:10px;font-size:14px}
.scaler button{font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
.vtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.vtabs button{font:inherit;font-size:14px;flex:1;min-width:120px;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.vtabs button.on{color:var(--text);border-color:var(--accent);font-weight:600}
.vtabs button.on.minev{border-color:var(--andrew);color:var(--andrew)}
.vnote,.matchnote{font:italic 15px/1.4 var(--serif);color:var(--muted);margin:0 0 6px}
.matchnote{color:var(--good)}
.spec{list-style:none;margin:0;padding:0}
.spec li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.spec li:last-child{border-bottom:0}
.spec li.opt{opacity:.7}
.amt{flex:0 0 112px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent2)}
.ing small{display:block;color:var(--muted);font-size:12px}
.preplink{color:var(--text);border-bottom:1px dotted var(--andrew)}
.tag{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.diff{margin:10px 0 2px;font-size:14px}
.diff summary{cursor:pointer;color:var(--accent2)}
.diff ul{list-style:none;padding:0;margin:6px 0 0}.diff li{padding:2px 0}
.d-add{color:var(--good)}.d-rem{color:var(--bad)}.d-chg{color:var(--text)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 4px}
.kv div{background:var(--card2);border-radius:10px;padding:8px 10px;font-size:14px}
.kv span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font:600 19px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.lin{margin:6px 0;font-size:15px}.lin>.muted{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kids{margin:4px 0 0;padding-left:18px}.kids small{display:block;color:var(--muted)}
.conf{font-size:11px;text-transform:none;letter-spacing:0;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.conf-high{background:rgba(124,191,138,.15);color:var(--good)}.conf-medium{background:rgba(214,162,74,.15);color:var(--accent2)}.conf-low{background:rgba(224,122,98,.15);color:var(--bad)}
.conf-own{background:color-mix(in srgb,var(--andrew) 15%,transparent);color:var(--andrew)}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:14px}
.src{display:flex;gap:6px;align-items:center}
.xlinks{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:14px}
.said{font:italic 15px/1.45 var(--serif);background:var(--card2);border-left:3px solid var(--andrew);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.said span{display:block;font:600 11px/1.4 -apple-system,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stars{display:flex;gap:4px;margin-bottom:8px}
.stars button{font-size:24px;background:none;border:0;color:var(--line);cursor:pointer;padding:0 2px}
.stars button.on{color:var(--accent)}
.toggles{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;font-size:14px}
.toggles label{display:flex;gap:8px;align-items:center}
input[type=checkbox]{flex-shrink:0;width:18px;height:18px;accent-color:var(--accent);padding:0}
.tree summary{cursor:pointer;font:17px/1.35 var(--serif);list-style:none}
.tree summary b{font-weight:600}
.tree summary .muted{font:14px -apple-system,sans-serif}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:'▸ ';color:var(--accent)}.tree details[open] summary::before{content:'▾ '}
.treeul,.treeul ul{list-style:none;margin:0;padding-left:16px;border-left:1px solid var(--line)}
.treeul{margin-top:8px}
.treeul li{padding:5px 0 3px 10px;position:relative}
.treeul li::before{content:'';position:absolute;left:-16px;top:16px;width:20px;border-top:1px solid var(--line)}
.treeul small{display:block;color:var(--muted);font-size:12px}
.tlist,.todo{list-style:none;padding:0;margin:0}.tlist li,.todo li{padding:8px 0;border-bottom:1px solid var(--line)}.tlist li:last-child,.todo li:last-child{border:0}
.todo small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.bul{margin:4px 0;padding-left:18px}.bul li{margin:3px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.coef{display:grid;grid-template-columns:70px repeat(3,1fr);gap:6px;align-items:center;font-size:14px}
.coef input{width:100%;padding:8px;min-width:0}
.weigh{display:grid;grid-template-columns:1fr 1fr;gap:8px}.weigh input,.weigh select{min-width:0;width:100%}.weigh select,.weigh .btn{grid-column:1/-1}
.tests{list-style:none;padding:0;margin:0;font-size:13px}
.tests li{padding:5px 0;border-bottom:1px solid var(--line)}.tests small{display:block;color:var(--muted)}
.t-pass b{color:var(--good)}.t-fail b{color:var(--bad)}.t-warn b{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 0;font:italic 16px var(--serif)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:10}
nav.tabs a{flex:1;text-align:center;color:var(--muted);font-size:11px;padding:4px 0}
nav.tabs a i{display:block;font-style:normal;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--accent2)}

/* ---------- filter components ---------- */
.full{width:100%;margin:8px 0 4px}
.pillbar{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.pillbar::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.pillbar button{font:inherit;font-size:14px;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:all .15s}
.pillbar button i{font-style:normal;font-size:15px}
.pillbar button span{font-size:11px;opacity:.7}
.pillbar button.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--ink);font-weight:600}
.pillbar button.on span{opacity:.75}
.rail{display:flex;gap:8px;overflow-x:auto;margin:12px -14px 2px;padding:2px 14px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.tile{position:relative;flex:0 0 auto;scroll-snap-align:start;min-width:78px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 8px;color:var(--text);cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.tile:active{transform:scale(.96)}
.tile i{font-style:normal;font-size:26px;line-height:1.1;display:flex;align-items:center;justify-content:center;height:30px}
.tile span{font-size:12px;font-weight:600;white-space:nowrap}
.tile small{font-size:10px;color:var(--muted);white-space:nowrap}
.tile b{position:absolute;top:5px;right:7px;font-size:10px;color:var(--muted);font-weight:600}
.tile.on{border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 18%,var(--card));box-shadow:0 0 0 1px var(--c,var(--accent)) inset}
.tile.on span{color:var(--c,var(--accent2))}
.rail.wide .tile{min-width:118px}
.rail.tools{margin-top:4px}.rail.tools .tile{flex:1;min-width:104px;padding:14px 8px 10px}.rail.tools .tile i{font-size:30px;height:36px}
.dotc{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 25%,transparent)}
.pillbar .dotc{width:10px;height:10px;box-shadow:none}
.pillbar button.on .dotc{background:var(--ink)}
.fams .tile{min-width:96px}
.fruitdot{display:block;width:24px;height:24px;border-radius:50%;box-shadow:inset -4px -4px 0 rgba(0,0,0,.15)}
.filterbtn b{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:11px;line-height:18px;margin-left:4px}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.achip{font:inherit;font-size:12px;background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--text);border:1px solid var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer}
.achip b{color:var(--accent2);margin-left:2px}.achip.clear{background:transparent;border-color:var(--line);color:var(--muted)}
.filterpanel{padding:10px 14px}
.filterpanel .flabel{margin-top:10px}
.row.tight{align-items:center;margin-top:4px}.row.tight .pillbar{margin:0;padding:0}
.btn.small{padding:5px 10px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600;width:100%;padding:13px}
body.noscroll{overflow:hidden}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;display:flex;flex-direction:column;background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;z-index:21;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);animation:up .22s ease-out;max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;font:600 20px var(--serif);padding-bottom:4px}
.sheet-body{overflow-y:auto;flex:1;margin:0 -14px;padding:0 14px 10px}
.sheet .pillbar{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.sheet .rail{margin:0 -14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.card{box-shadow:inset 3px 0 0 var(--c,transparent)}
.mk.star{color:var(--accent);border:0;letter-spacing:-1px}
.mk.calc{color:var(--accent2);border-color:var(--accent)}
.chip.mine{border-color:var(--andrew)}.chip.more{color:var(--muted);cursor:default}
.apocard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--card)),var(--card));border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin:12px 0;color:var(--text)}
.apocard i{font-style:normal;font-size:28px}.apocard div{flex:1}.apocard b{display:block;font:600 17px var(--serif)}.apocard span{font-size:13px;color:var(--muted)}.apocard em{font-style:normal;font-size:24px;color:var(--accent2)}
.callout{font:italic 15px/1.45 var(--serif);border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:10px 14px;border-radius:0 12px 12px 0;margin:6px 0 4px}

/* ---------- evolution ---------- */
.timeline{position:relative;padding-left:26px;margin-top:6px}
.timeline::before{content:'';position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--accent),var(--line) 60%,var(--andrew))}
.era{margin-bottom:6px}
.era-head{display:flex;align-items:center;gap:10px;margin:18px 0 6px -26px;position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 0}
.era-ico{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--bg);border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
.era-head b{display:block;font:600 19px var(--serif)}.era-head small{color:var(--muted);font-size:12px}
.evo-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0;box-shadow:inset 3px 0 0 var(--c)}
.evo-card::before{content:'';position:absolute;left:-21px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.evo-card.trunk{border-color:var(--accent);background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card) 70%)}
.evo-card.trunk::before{width:14px;height:14px;left:-23px;box-shadow:0 0 0 3px var(--bg),0 0 12px var(--accent)}
.evo-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.yr{font-weight:700;color:var(--c);letter-spacing:.03em}
.evo-name{font:600 20px/1.2 var(--serif);text-transform:none;letter-spacing:0;margin:2px 0 4px;color:var(--text)}
.evo-name a{color:var(--text)}
.trunk-badge{font:600 10px -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);background:var(--accent);border-radius:5px;padding:2px 6px;vertical-align:middle}
.formula{font:600 12px/1.4 ui-monospace,Menlo,monospace;color:var(--accent2);letter-spacing:.02em;margin-bottom:4px}
.formula.big{font-size:15px}
.evo-card p{font-size:14px;margin:4px 0 6px}
.evo-from{font-size:13px;color:var(--muted);margin:3px 0}
.mine-count{font-size:12px;color:var(--andrew);margin-top:6px}
.evotree,.evotree ul{list-style:none;margin:0;padding-left:16px}
.evotree{padding-left:0}
.evotree ul{border-left:2px solid var(--line);margin-left:8px}
.evotree li{position:relative;padding:3px 0}
.evotree ul>li::before{content:'';position:absolute;left:-16px;top:17px;width:14px;border-top:2px solid var(--line)}
.tnode{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;color:var(--text)}
.tnode:active{background:var(--card2)}
.tnode .dotc{width:12px;height:12px;flex:0 0 12px}
.tn{font-weight:600}.ty{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tc{font-size:11px;min-width:20px;text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:0 5px;color:var(--muted)}
.evotree li.trunk>.tnode{background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid var(--accent)}
.evotree li.trunk>.tnode .tn{font:600 17px var(--serif)}
.evotree li.dim>.tnode{opacity:.35}
.also{display:block;margin:-2px 0 2px 36px;font-size:11px;color:var(--muted)}
.pathline{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:4px 0;align-items:center}
.pathline li{font-size:14px;display:flex;align-items:center}
.pathline li::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.pathline li:not(:last-child)::after{content:'→';color:var(--muted);margin:0 8px}
.pathline small{color:var(--muted);margin-left:4px}
.pathline li.here b{color:var(--c)}

/* ---------- apothecary ---------- */
.ratio{font:600 13px/1.4 ui-monospace,Menlo,monospace;color:var(--accent2);margin:12px 0 2px}
.inlabel,.flabel{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
.numin{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.numin input{flex:1;min-width:0;border:0;background:transparent;font:600 26px/1 var(--serif);text-align:center;padding:10px 4px;font-variant-numeric:tabular-nums}
.numin .unit{color:var(--muted);font-size:15px;padding-right:6px}
.numin button{font:inherit;font-size:24px;width:52px;align-self:stretch;background:transparent;border:0;color:var(--accent2);cursor:pointer}
.numin button:active{background:var(--line)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo label{font-size:12px;color:var(--muted)}
.duo .numin input{font-size:20px}.duo .numin button{width:36px}
.outgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0 8px}
.outgrid div{background:var(--card2);border-radius:12px;padding:10px 12px}
.outgrid div.hi{background:color-mix(in srgb,var(--accent) 16%,var(--card2));border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.outgrid b{display:block;font:600 24px/1.15 var(--serif);font-variant-numeric:tabular-nums}
.outgrid span{display:block;font-size:12px;color:var(--muted)}
.outgrid small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.steps{padding-left:20px;margin:4px 0}.steps li{margin:5px 0}
.sygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.sytile{position:relative;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;color:var(--text);cursor:pointer}
.sytile i{font-style:normal;font-size:24px}.sytile span{font-size:12px;font-weight:600;text-align:center}
.sytile em{position:absolute;top:3px;right:5px;font-style:normal;font-size:11px}
.sytile.mine{border-color:color-mix(in srgb,var(--andrew) 45%,var(--line))}
.sytile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--card2));box-shadow:0 0 0 1px var(--accent) inset}
.savebtn{margin-top:4px}.savemsg{margin-left:8px}
.badgeline{margin-top:12px}
.warnline{font-size:13px;color:var(--bad)}
.fruits .tile{min-width:84px}
.sym{font-size:.8em;display:inline-block;transform:rotate(-14deg);margin-left:2px}
.varpick{margin:4px 0 10px;padding:10px 12px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.varpick .flabel{margin:0 0 2px}.varpick .pillbar{flex-wrap:wrap;overflow:visible;margin:6px 0 0;padding:0}
.varname{margin:10px 0 0;font:italic 15px/1.4 var(--serif)}
.mk.vars{color:var(--accent2);border-color:var(--accent)}
@media (min-width:700px){ .stats{grid-template-columns:repeat(6,1fr)} }
</style>
